services:
  server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.mcp
    container_name: memodi-server
    environment:
      MEMODI_DB_HOST: host.docker.internal
      MEMODI_DB_PORT: 5432
      MEMODI_DB_USER: ${MEMODI_DB_USER}
      MEMODI_DB_PASSWORD: ${MEMODI_DB_PASSWORD}
      MEMODI_DB_NAME: ${MEMODI_DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - memodi

  caddy:
    image: caddy:2-alpine
    container_name: memodi-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MEMODI_API_KEY: ${MEMODI_API_KEY}
      MEMODI_DOMAIN: ${MEMODI_DOMAIN}
    restart: unless-stopped
    networks:
      - memodi

volumes:
  caddy_data:
  caddy_config:

networks:
  memodi:
