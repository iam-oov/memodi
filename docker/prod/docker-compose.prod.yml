services:
  caddy:
    image: caddy:2-alpine
    container_name: memodi-caddy
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MEMODI_API_KEY: ${MEMODI_API_KEY}
      MEMODI_DOMAIN: ${MEMODI_DOMAIN}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
