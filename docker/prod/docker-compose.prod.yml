services:
  caddy:
    image: caddy:2-alpine
    container_name: memodi-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      MEMODI_API_KEY: ${MEMODI_API_KEY}
      MEMODI_DOMAIN: ${MEMODI_DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
