services:
  db:
    image: ghcr.io/iam-oov/memodi-db:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    container_name: memodi-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: memodi
      POSTGRES_PASSWORD: memodi_dev
      POSTGRES_DB: memodi
    volumes:
      - memodi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memodi"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    container_name: memodi-server
    ports:
      - "8787:8787"
    environment:
      MEMODI_DB_HOST: db
      MEMODI_DB_PORT: 5432
      MEMODI_DB_USER: memodi
      MEMODI_DB_PASSWORD: memodi_dev
      MEMODI_DB_NAME: memodi
    depends_on:
      db:
        condition: service_healthy

volumes:
  memodi_data:
