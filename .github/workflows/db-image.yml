name: Build DB Image

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.db"
      - "docker/init-extensions.sql"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.db
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-db:latest
            ghcr.io/${{ github.repository }}-db:${{ github.sha }}
