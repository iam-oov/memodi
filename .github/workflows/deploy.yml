name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: memodi
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd memodi
            git fetch origin main
            git reset --hard origin/main
            ~/.local/bin/uv sync --reinstall-package memodi
            sudo systemctl restart memodi
            sleep 3
            systemctl is-active --quiet memodi || {
              echo "DEPLOY FAILED: memodi service not active"
              journalctl -u memodi -n 30 --no-pager
              exit 1
            }
            EXPECTED=$(.venv/bin/python -c "from memodi.__about__ import __version__; print(__version__)")
            INSTALLED=$(.venv/bin/python -c "from importlib.metadata import version; print(version('memodi'))")
            if [ "$EXPECTED" != "$INSTALLED" ]; then
              echo "DEPLOY FAILED: version mismatch. source=$EXPECTED, installed=$INSTALLED"
              journalctl -u memodi -n 30 --no-pager
              exit 1
            fi
            echo "Deploy verified: memodi $INSTALLED running"
            cd docker/prod
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
