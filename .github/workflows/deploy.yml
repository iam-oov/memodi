name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memodi
          POSTGRES_PASSWORD: memodi_dev
          POSTGRES_DB: memodi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memodi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Run tests
        env:
          MEMODI_DB_USER: memodi
          MEMODI_DB_PASSWORD: memodi_dev
          MEMODI_DB_NAME: memodi
          MEMODI_DB_HOST: localhost
        run: uv run pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: memodi
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd memodi
            git pull origin main
            cd docker/prod
            docker compose -f docker-compose.prod.yml up -d --build
