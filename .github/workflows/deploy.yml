name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start database
        run: |
          docker compose pull db 2>/dev/null || true
          docker compose up -d db --wait

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Run tests
        env:
          MEMODI_DB_USER: memodi
          MEMODI_DB_PASSWORD: memodi_dev
          MEMODI_DB_NAME: memodi
          MEMODI_DB_HOST: localhost
        run: uv run pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: memodi
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd memodi
            git pull origin main
            ~/.local/bin/uv sync
            sudo systemctl restart memodi
            sleep 3
            systemctl is-active --quiet memodi || {
              echo "DEPLOY FAILED: memodi service not active"
              journalctl -u memodi -n 30 --no-pager
              exit 1
            }
            cd docker/prod
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
