name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start database
        run: |
          docker compose pull db 2>/dev/null || true
          docker compose up -d db --wait

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Run tests
        env:
          MEMODI_DB_USER: memodi
          MEMODI_DB_PASSWORD: memodi_dev
          MEMODI_DB_NAME: memodi
          MEMODI_DB_HOST: localhost
        run: uv run pytest -v
